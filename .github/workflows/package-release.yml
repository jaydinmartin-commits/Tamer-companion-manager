name: Package Foundry Release

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (for example, v0.1.0)
        required: true
        default: v0.1.7

permissions:
  contents: write

jobs:
  package:
    # Every main push packages the current module.json version. This keeps Foundry releases in sync with code changes.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            VERSION="$(grep '"version"' module.json | head -1 | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare release manifest
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("module.json")
          data = json.loads(p.read_text())
          data["version"] = "${{ steps.release.outputs.version }}"
          data["download"] = "https://github.com/jaydinmartin-commits/Tamer-companion-manager/releases/download/${{ steps.release.outputs.tag }}/tamer-companion-manager-v${{ steps.release.outputs.version }}.zip"
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY
      - name: Build Foundry package ZIP
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          mkdir -p dist
          zip -r "dist/tamer-companion-manager-v${VERSION}.zip" \
            module.json scripts templates styles macros README.md

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "Tamer Companion Manager $TAG" \
              --generate-notes
          fi

      - name: Upload package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          gh release upload "$TAG" \
            "dist/tamer-companion-manager-v${VERSION}.zip" \
            module.json \
            --clobber

