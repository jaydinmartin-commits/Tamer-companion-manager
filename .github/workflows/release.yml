name: Build and Release Foundry Module

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read module version
        id: module
        shell: bash
        run: |
          VERSION=$(node -p "require('./module.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.module.outputs.version }}
        shell: bash
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Foundry module ZIP
        if: steps.release.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.module.outputs.version }}
        shell: bash
        run: |
          ZIP="tamer-companion-manager-v$VERSION.zip"
          rm -f "$ZIP"
          zip -r "$ZIP" .             -x ".git/*"                ".github/*"                "$ZIP"
          echo "Built $ZIP"
          unzip -l "$ZIP" | sed -n '1,80p'
          unzip -l "$ZIP" | grep -E '(^|/)module\.json$'

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.module.outputs.version }}
        shell: bash
        run: |
          ZIP="tamer-companion-manager-v$VERSION.zip"
          gh release create "v$VERSION" "$ZIP"             --title "Tamer Companion Manager v$VERSION"             --generate-notes
